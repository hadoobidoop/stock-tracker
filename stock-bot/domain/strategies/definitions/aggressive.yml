# 공격적 전략 (Aggressive Strategy)
# 약한 신호도 포함하여 적극적인 거래를 추구하는 전략

# 전략 기본 정보
strategy_info:
  name: "공격적 전략"
  description: "약한 신호도 포함하여 적극적인 거래를 추구하는 전략"
  version: "1.0.0"
  author: "Stock-Bot Team"
  created_date: "2025-01-20"

# 전략 신호 설정
signal_config:
  threshold: 5.0                       # 낮은 임계값 (기본 8.0 → 5.0)
  score_multiplier: 1.2                # 높은 점수 배수 (공격적)
  
  # 시장 상황별 배수 (공격적 설정)
  market_multipliers:
    long_term_bullish: 1.3             # 높은 상승장 배수
    long_term_bearish: 1.3             # 높은 하락장 배수

# 포지션 관리 설정
position_management:
  max_positions: 8                     # 많은 포지션 수
  position_hold_hours: 168             # 짧은 보유 기간 (7일)

# 리스크 관리 설정
risk_management:
  risk_per_trade: 0.03                 # 높은 리스크 (3%)
  stop_loss_percentage: 4.0            # 타이트한 손절
  take_profit_percentage: 8.0          # 낮은 익절 (빠른 수익 실현)

# 신호 감지기 설정 (공격적 가중치)
detectors:
  # SMA 감지기
  sma:
    enabled: true
    weight: 4.0                        # 낮은 가중치 (빠른 반응)
    parameters:
      short_period: 10                 # 짧은 기간 (공격적)
      long_period: 30                  # 짧은 기간 (공격적)
      adx_threshold: 15                # 낮은 ADX 임계값 (민감)
      continuation_weight: 0.6         # 높은 지속 가중치
      trend_confirmation_required: false # 추세 확인 불필요

  # MACD 감지기
  macd:
    enabled: true
    weight: 4.0                        # 낮은 가중치
    parameters:
      fast_period: 8                   # 빠른 기간 (공격적)
      slow_period: 21                  # 빠른 기간 (공격적)
      signal_period: 7                 # 빠른 신호선
      histogram_threshold: -0.1        # 낮은 히스토그램 임계값

  # Volume 감지기
  volume:
    enabled: true
    weight: 3.0                        # 낮은 가중치
    parameters:
      volume_ma_period: 10             # 짧은 거래량 기간
      volume_multiplier: 1.2           # 낮은 거래량 배수 (민감)
      price_volume_correlation: 0.4    # 낮은 상관관계 요구

  # Composite 감지기
  composite:
    enabled: true
    weight: 5.0                        # 중간 가중치
    parameters:
      use_momentum_consensus: true
      use_trend_analysis: true
      use_volume_analysis: false       # 거래량 분석 제외 (빠른 반응)
      consensus_threshold: 0.4         # 낮은 컨센서스 임계값 (민감)

# 규칙 조합 (공격적 규칙)
trading_rules:
  # 매수 규칙들 (관대한 조건)
  buy_conditions:
    - rule: "momentum_oversold_consensus"
      weight: 0.4
      required: false
      
    - rule: "trend_sma_golden_cross"
      weight: 0.3
      required: false
      
    - rule: "volume_above_average"
      weight: 0.15
      required: false
      
    - rule: "volatility_low_bb_squeeze"
      weight: 0.15
      required: false

  # 매도 규칙들 (빠른 이익 실현)
  sell_conditions:
    - rule: "momentum_overbought_rsi"
      weight: 0.6                      # 높은 가중치 (빠른 매도)
      required: false
      
    - rule: "trend_sma_death_cross"
      weight: 0.25
      required: false
      
    - rule: "volume_below_average"
      weight: 0.15
      required: false

# 시장 필터 설정 (관대한 필터링)
market_filters:
  # 최소 거래량 필터 (낮은 기준)
  min_volume:
    enabled: true
    value: 500000                      # 낮은 최소 거래량

  # 가격 범위 필터 (넓은 범위)
  price_range:
    enabled: true
    min_price: 1.0                     # 낮은 최소 주가
    max_price: 2000.0                  # 높은 최대 주가

  # 변동성 필터 (높은 변동성 허용)
  volatility:
    enabled: true
    min_atr_ratio: 0.01                # 낮은 최소 변동성
    max_atr_ratio: 0.20                # 높은 최대 변동성

# 전략 모드별 설정
mode_overrides:
  # 백테스팅 모드 설정
  backtest:
    position_management:
      max_positions: 10                # 더 많은 포지션
    
  # 실시간 거래 모드 설정  
  live:
    risk_management:
      risk_per_trade: 0.025            # 약간 보수적

# 메타데이터
metadata:
  tags: ["aggressive", "high-risk", "high-frequency", "scalping"]
  compatible_timeframes: ["1h", "30m", "15m", "1d"]
  recommended_symbols: ["growth-stocks", "small-cap", "crypto", "volatile"]
  min_capital: 10000                   # 낮은 최소 자본