# TREND PULLBACK 전략 정의
# 상승 추세 중 일시적 하락(눌림목) 시 매수하는 전략
# 강한 추세가 있지만 일시적으로 되돌아가는 구간에서 진입

# 전략 기본 정보
strategy_info:
  name: "추세 되돌림 전략"
  description: "상승 추세 중 일시적 하락(눌림목) 시 매수하는 전략"
  version: "1.0.0"
  author: "Stock-Bot System"
  created_date: "2025-01-20"

# 전략 신호 설정
signal_config:
  threshold: 6.5                      # 중간 수준의 임계값
  score_multiplier: 1.0               # 점수 조정 배수
  
  # 시장 상황별 배수
  market_multipliers:
    long_term_bullish: 1.3            # 장기 상승장에서 매우 유리
    long_term_bearish: 0.7            # 장기 하락장에서 신중

# 포지션 관리 설정
position_management:
  max_positions: 4                    # 눌림목 기회 포착 - 적극적 포지션
  position_hold_hours: 120            # 5일 (120시간) 보유

# 리스크 관리 설정
risk_management:
  risk_per_trade: 0.025               # 거래당 리스크 비율 (2.5%)
  stop_loss_percentage: 5.0           # 손절 비율 (5%) - 낮게 설정
  take_profit_percentage: 12.0        # 익절 비율 (12%) - 빠른 수익 실현

# 신호 감지기 설정
detectors:
  # SMA 감지기 (추세 확인 + 눌림목 감지)
  sma:
    enabled: true
    weight: 5.0
    parameters:
      short_period: 20                # 단기 이평선 기간
      long_period: 50                 # 장기 이평선 기간
      adx_threshold: 20               # ADX 임계값 (기본값)
      continuation_weight: 0.5        # 기본 0.4에서 더 보수적으로
      trend_confirmation_required: true # 추세 확인 필요
      pullback_mode: true             # 눌림목 모드 활성화

  # RSI 감지기 (과매도 시점 포착 - 핵심)
  rsi:
    enabled: true
    weight: 6.0                       # 가장 높은 가중치
    parameters:
      oversold_threshold: 40          # 기본 35에서 더 관대하게
      overbought_threshold: 60        # 기본 65에서 더 관대하게
      period: 14                      # RSI 계산 기간
      pullback_mode: true             # 눌림목 모드 활성화

  # ADX 감지기 (추세 강도 확인)
  adx:
    enabled: true
    weight: 4.0
    parameters:
      adx_threshold: 25               # ADX 임계값 (기본값)
      period: 14                      # ADX 계산 기간
      trend_strength_required: true   # 추세 강도 확인 필요
      pullback_mode: true             # 눌림목 모드 활성화

# 규칙 조합 (눌림목 전략 특화)
trading_rules:
  # 매수 규칙들
  buy_conditions:
    - rule: "trend_sma_uptrend_confirmed"    # SMA 상승 추세 확인
      weight: 0.3
      required: true                         # 필수 조건 (추세 확인)
      
    - rule: "momentum_rsi_oversold"          # RSI 과매도 (눌림목)
      weight: 0.4                            # 가장 중요한 신호
      required: true                         # 필수 조건
      
    - rule: "trend_adx_strong"               # ADX 강한 추세
      weight: 0.2
      required: true                         # 필수 조건 (추세 강도)
      
    - rule: "trend_pullback_opportunity"     # 눌림목 기회 감지
      weight: 0.1
      required: false

  # 매도 규칙들
  sell_conditions:
    - rule: "momentum_rsi_overbought"        # RSI 과매수 (회복 완료)
      weight: 0.4
      required: false
      
    - rule: "trend_sma_resistance"           # SMA 저항선 도달
      weight: 0.3
      required: false
      
    - rule: "trend_adx_weak"                 # ADX 약한 추세 (추세 약화)
      weight: 0.3
      required: false

# 시장 필터 설정 (눌림목용)
market_filters:
  # 최소 거래량 필터
  min_volume:
    enabled: true
    value: 1500000                    # 최소 일간 거래량

  # 가격 범위 필터
  price_range:
    enabled: true
    min_price: 8.0                    # 최소 주가
    max_price: 800.0                  # 최대 주가

  # 변동성 필터 (눌림목에 적합한 변동성)
  volatility:
    enabled: true
    min_atr_ratio: 0.02               # 최소 ATR 비율
    max_atr_ratio: 0.10               # 최대 ATR 비율

  # 추세 정렬 필터 (상승 추세 필수)
  trend_alignment:
    enabled: true                     # 활성화
    require_market_trend: true        # 시장 추세 일치 필요
    require_bullish_bias: true        # 상승 편향 필요

# 전략 모드별 설정
mode_overrides:
  # 백테스팅 모드 설정
  backtest:
    position_management:
      max_positions: 6                # 백테스팅에서 더 많은 포지션
    signal_config:
      threshold: 6.0                  # 백테스팅에서 더 민감하게
    
  # 실시간 거래 모드 설정  
  live:
    risk_management:
      risk_per_trade: 0.02            # 실시간에서 더 보수적
    position_management:
      max_positions: 3                # 실시간에서 포지션 제한
    signal_config:
      threshold: 7.0                  # 실시간에서 더 신중하게

# 메타데이터
metadata:
  tags: ["trend-pullback", "counter-trend", "rsi-focused", "mean-reversion"]
  compatible_timeframes: ["1h", "4h", "1d"]           # 단기~중기 시간프레임
  recommended_symbols: ["stocks", "etf"]              # 권장 심볼 유형
  min_capital: 25000                                  # 최소 권장 자본
  max_daily_trades: 8                                 # 일일 최대 거래 수
  strategy_type: "trend_pullback"                     # 전략 분류
  optimal_market_conditions: ["bullish_with_pullbacks", "trending_up"] # 최적 시장 상황
  risk_level: "medium_low"                            # 리스크 수준