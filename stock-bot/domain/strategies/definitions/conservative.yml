# 보수적 전략 (Conservative Strategy)
# 높은 신뢰도의 강한 신호만 사용하는 안전한 전략

# 전략 기본 정보
strategy_info:
  name: "보수적 전략"
  description: "높은 신뢰도의 강한 신호만 사용하는 안전한 전략"
  version: "1.0.0"
  author: "Stock-Bot Team"
  created_date: "2025-01-20"

# 전략 신호 설정
signal_config:
  threshold: 12.0                      # 높은 임계값 (기본 8.0 → 12.0)
  score_multiplier: 0.8                # 점수 조정 배수 (보수적)
  
  # 시장 상황별 배수 (보수적 설정)
  market_multipliers:
    long_term_bullish: 1.1             # 장기 상승장 배수 (기본 1.2 → 1.1)
    long_term_bearish: 1.1             # 장기 하락장 배수 (기본 1.2 → 1.1)

# 포지션 관리 설정
position_management:
  max_positions: 3                     # 적은 포지션 수
  position_hold_hours: 672             # 긴 보유 기간 (28일)

# 리스크 관리 설정
risk_management:
  risk_per_trade: 0.01                 # 낮은 리스크 (1%)
  stop_loss_percentage: 5.0            # 손절 비율
  take_profit_percentage: 12.0         # 익절 비율

# 신호 감지기 설정 (보수적 가중치)
detectors:
  # SMA 감지기
  sma:
    enabled: true
    weight: 6.0                        # 보수적 가중치
    parameters:
      short_period: 20
      long_period: 50
      adx_threshold: 25                # 높은 ADX 임계값 (보수적)
      continuation_weight: 0.4
      trend_confirmation_required: true # 추세 확인 필수

  # MACD 감지기
  macd:
    enabled: true
    weight: 6.0                        # 보수적 가중치
    parameters:
      fast_period: 12
      slow_period: 26
      signal_period: 9
      histogram_threshold: 0.1         # 높은 히스토그램 임계값

  # Volume 감지기
  volume:
    enabled: true
    weight: 5.0                        # 보수적 가중치
    parameters:
      volume_ma_period: 20
      volume_multiplier: 2.0           # 높은 거래량 배수 (보수적)
      price_volume_correlation: 0.8    # 높은 상관관계 요구

  # Composite 감지기 (높은 가중치)
  composite:
    enabled: true
    weight: 8.0                        # 복합 지표 높은 가중치
    parameters:
      use_momentum_consensus: true
      use_trend_analysis: true
      use_volume_analysis: true
      consensus_threshold: 0.7         # 높은 컨센서스 임계값 (보수적)

# 규칙 조합 (보수적 규칙 적용)
trading_rules:
  # 매수 규칙들 (모든 조건이 엄격)
  buy_conditions:
    - rule: "momentum_oversold_consensus"
      weight: 0.25
      required: true                   # 필수 조건
      
    - rule: "trend_sma_golden_cross"
      weight: 0.25
      required: true                   # 필수 조건
      
    - rule: "volume_above_average"
      weight: 0.25
      required: true                   # 필수 조건
      
    - rule: "volatility_low_bb_squeeze"
      weight: 0.25
      required: false

  # 매도 규칙들
  sell_conditions:
    - rule: "momentum_overbought_rsi"
      weight: 0.5
      required: false
      
    - rule: "trend_sma_death_cross"
      weight: 0.3
      required: false
      
    - rule: "volume_below_average"
      weight: 0.2
      required: false

# 시장 필터 설정 (보수적 필터링)
market_filters:
  # 최소 거래량 필터 (높은 기준)
  min_volume:
    enabled: true
    value: 2000000                     # 높은 최소 거래량

  # 가격 범위 필터
  price_range:
    enabled: true
    min_price: 10.0                    # 높은 최소 주가 (보수적)
    max_price: 500.0                   # 낮은 최대 주가 (보수적)

  # 변동성 필터 (낮은 변동성 선호)
  volatility:
    enabled: true
    min_atr_ratio: 0.01                # 낮은 최소 변동성
    max_atr_ratio: 0.06                # 낮은 최대 변동성

# 전략 모드별 설정
mode_overrides:
  # 백테스팅 모드 설정
  backtest:
    position_management:
      max_positions: 5
    
  # 실시간 거래 모드 설정  
  live:
    risk_management:
      risk_per_trade: 0.005            # 더욱 보수적

# 메타데이터
metadata:
  tags: ["conservative", "safe", "low-risk", "high-confidence"]
  compatible_timeframes: ["1d", "4h"]
  recommended_symbols: ["large-cap", "blue-chip", "etf"]
  min_capital: 50000                   # 높은 최소 자본 (보수적)